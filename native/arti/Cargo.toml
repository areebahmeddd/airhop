[package]
name = "arti-airhop"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
description = "Airhop's embedded Tor client. Wraps arti-client behind a SOCKS5 listener and one FFI surface shared by iOS and Android."

[lib]
name = "arti_airhop"
# staticlib for the Apple xcframework; cdylib for Android jniLibs.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Use rustls instead of native-tls to avoid OpenSSL and the platform trust store.
# Disable arti-client defaults and enable only the features needed by Airhop.
#
# `compression` is the one upstream default worth keeping: uncompressed
# directory downloads cost bandwidth on a phone.
#
# `bridge-client` and `pt-client` are what let src/bridges.rs reach an unlisted
# entry point through a transport. See native/iptproxy for the transports.
#
# The version is duplicated from ARTI_CLIENT_VERSION in TOOLCHAIN.env because
# cargo cannot read it from there. Nowhere else restates it.
arti-client = { version = "0.47", default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "bridge-client",
    "pt-client",
    "onion-service-client",
    "vanguards",
    "static-sqlite",
] }
tor-rtcompat = { version = "0.47", default-features = false, features = [
    "tokio",
    "rustls",
] }

# The rustls cryptographic provider, chosen here because arti does not choose:
# tor-rtcompat takes rustls with no provider feature and requires the
# application to install one. With neither `ring` nor `aws-lc-rs` enabled
# anywhere in the graph, rustls panics inside `TorClient::builder`.
#
# `ring` rather than the `aws-lc-rs` upstream recommends. aws-lc-rs would add a
# hybrid post-quantum handshake, but needs cmake and libclang in the container
# for three Android ABIs and two Apple slices; ring builds with the NDK clang
# cargo-ndk already supplies and is in the graph anyway under rustls-webpki.
#
# lib.rs also calls `install_default` explicitly: feature unification is
# something a later dependency change can undo silently.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Unwinding, with every FFI entry point wrapped in `catch_panic` (lib.rs).
# Aborting would take the mesh, the wallet and the courier store with it, none
# of which depend on Tor. The unwind tables cost a little size.
panic = "unwind"
strip = "symbols"

# Apple uses a staticlib, so rustc does not perform the final link or run LTO.
# Disable LTO to avoid embedding LLVM bitcode in the archive; Xcode performs
# optimization and dead stripping when it links the app.
[profile.apple]
inherits = "release"
lto = false
