name: Sync Bridge Directory

on:
  schedule:
    # Weekly on Sunday at 07:00 UTC
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Moat's built-in endpoint, the same source Tor Browser uses.
  SOURCE_URL: https://bridges.torproject.org/moat/circumvention/builtin
  UPDATE_BRANCH: automation/bridges
  PR_TITLE: "chore(bridges): sync built-in bridges from the Tor Project"
  BRIDGE_FILES: src/data/bridges.ts

jobs:
  sync:
    name: Propose sync from upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Fetch candidate
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --show-error --silent --location \
            --proto "=https" --proto-redir "=https" --tlsv1.2 \
            --max-time 60 --retry 3 --retry-all-errors \
            --request POST --header "Content-Type: application/vnd.api+json" \
            --output "$RUNNER_TEMP/bridges-candidate.json" \
            --write-out "%{url_effective}" "$SOURCE_URL")

          if [[ "$effective_url" != "$SOURCE_URL" ]]; then
            echo "::error::Unexpected redirect target: $effective_url"
            exit 1
          fi

      - name: Adopt and regenerate
        run: node scripts/sync-bridges.js --input "$RUNNER_TEMP/bridges-candidate.json"

      - name: Test the regenerated directory
        run: npm test -- --ci src/services/__tests__/tor-routing.test.ts

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          git add $BRIDGE_FILES
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Built-in bridges already match the Tor Project." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Open or update the proposal
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git commit -m "$PR_TITLE" \
            -m "Regenerated by scripts/sync-bridges.js from $SOURCE_URL."
          git push --force-with-lease origin "$UPDATE_BRANCH"

          if [ -z "$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$UPDATE_BRANCH" \
              --title "$PR_TITLE" \
              --body "Built-in bridge lines refreshed from the Tor Project's Moat endpoint, the same source Tor Browser uses.

          Review this rather than merging on green: these lines are how a censored user reaches the network, and a bridge that has been enumerated is worse than none because it looks like the safe choice."
          fi
