name: Sync Relay Directory

on:
  schedule:
    # Weekly on Sunday at 07:00 UTC
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Upstream relay directory and sync settings.
  # Rows are canonicalized to match scripts/relay-url.js for interoperability.
  SOURCE_REPOSITORY: https://github.com/permissionlesstech/georelays.git
  SOURCE_OWNER_REPO: permissionlesstech/georelays
  SOURCE_PATH: nostr_relays.csv
  STALE_AFTER_DAYS: 7
  UPDATE_BRANCH: automation/relays
  PR_TITLE: "chore(relays): sync relay directory from upstream"
  RELAY_FILES: assets/data/nostr_relays.csv src/data/relays.ts landing/src/data/relays.ts

jobs:
  sync:
    name: Propose sync from upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Fetch candidate at a pinned commit
        id: upstream
        run: |
          set -euo pipefail

          source_commit=$(git ls-remote --refs "$SOURCE_REPOSITORY" refs/heads/main | awk 'NR == 1 { print $1 }')
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve an immutable upstream commit"
            exit 1
          fi

          source_url="https://raw.githubusercontent.com/$SOURCE_OWNER_REPO/$source_commit/$SOURCE_PATH"
          effective_url=$(curl --fail --show-error --silent --location \
            --proto "=https" --proto-redir "=https" --tlsv1.2 \
            --max-time 60 --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/relays-candidate.csv" \
            --write-out "%{url_effective}" "$source_url")

          if [[ "$effective_url" != "$source_url" ]]; then
            echo "::error::Unexpected redirect target: $effective_url"
            exit 1
          fi

          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "url=$source_url" >> "$GITHUB_OUTPUT"

      - name: Validate candidate
        id: validation
        run: |
          node scripts/validate-relays.js \
            --input "$RUNNER_TEMP/relays-candidate.csv" \
            --baseline assets/data/nostr_relays.csv \
            --github-output "$GITHUB_OUTPUT"

      - name: Adopt candidate
        run: cp "$RUNNER_TEMP/relays-candidate.csv" assets/data/nostr_relays.csv

      - name: Regenerate relay modules
        run: node scripts/generate-relays.js

      - name: Test the regenerated directory
        run: |
          npm test -- --ci \
            src/core/nostr/__tests__/relay-url-parity.test.ts \
            src/services/__tests__/geohash-channels.test.ts

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          git add $RELAY_FILES
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Relay directory already matches [$SOURCE_OWNER_REPO/$SOURCE_PATH](https://github.com/$SOURCE_OWNER_REPO/blob/main/$SOURCE_PATH)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Open or update the proposal
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.upstream.outputs.commit }}
          UNIQUE_RELAYS: ${{ steps.validation.outputs.unique_relays }}
          ADDED: ${{ steps.validation.outputs.added }}
          REMOVED: ${{ steps.validation.outputs.removed }}
          ADDED_HOSTS: ${{ steps.validation.outputs.added_hosts }}
          REMOVED_HOSTS: ${{ steps.validation.outputs.removed_hosts }}
          DATA_SHA256: ${{ steps.validation.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh auth setup-git

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --base main --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')

          if [[ -n "$pr_number" ]] \
            && git fetch --no-tags --depth=1 origin "refs/heads/$UPDATE_BRANCH" 2> /dev/null \
            && git diff --quiet FETCH_HEAD -- $RELAY_FILES; then
            echo "[Proposal #$pr_number](https://github.com/$GITHUB_REPOSITORY/pull/$pr_number) already carries this directory." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"

          git commit -m "$PR_TITLE" \
            -m "Upstream: $SOURCE_OWNER_REPO/$SOURCE_PATH" \
            -m "Upstream-commit: $SOURCE_COMMIT" \
            -m "Relays: $UNIQUE_RELAYS (+$ADDED / -$REMOVED)" \
            -m "SHA-256: $DATA_SHA256"
          git push --force origin "HEAD:refs/heads/$UPDATE_BRANCH"

          body_file="$RUNNER_TEMP/relay-pr-body.md"
          cat > "$body_file" <<EOF
          Automated proposal, not auto-merged: this directory is compiled into the app bundle, so every row here ships to users.

          - Upstream: [$SOURCE_OWNER_REPO/$SOURCE_PATH](https://github.com/$SOURCE_OWNER_REPO/blob/$SOURCE_COMMIT/$SOURCE_PATH)
          - Upstream commit: [\`${SOURCE_COMMIT:0:7}\`](https://github.com/$SOURCE_OWNER_REPO/commit/$SOURCE_COMMIT)
          - History: [recent changes](https://github.com/$SOURCE_OWNER_REPO/commits/main/$SOURCE_PATH)
          - Relays: $UNIQUE_RELAYS (+$ADDED / -$REMOVED)
          - SHA-256: $DATA_SHA256

          ### Added ($ADDED)

          ~~~
          $ADDED_HOSTS
          ~~~

          ### Removed ($REMOVED)

          ~~~
          $REMOVED_HOSTS
          ~~~
          EOF

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" --body-file "$body_file"
            pr_url=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$UPDATE_BRANCH" --title "$PR_TITLE" --body-file "$body_file")
          fi

          echo "$UNIQUE_RELAYS relays (+$ADDED / -$REMOVED) proposed in $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Retire an obsolete proposal
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --base main --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')

          if [[ -n "$pr_number" ]]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --comment "Upstream now matches main; closing this obsolete proposal."
            echo "Closed obsolete [proposal #$pr_number](https://github.com/$GITHUB_REPOSITORY/pull/$pr_number)." >> "$GITHUB_STEP_SUMMARY"
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$UPDATE_BRANCH" > /dev/null; then
            git push origin --delete "$UPDATE_BRANCH"
          fi

      - name: Check upstream freshness
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          last=$(gh api "repos/${SOURCE_OWNER_REPO}/commits?path=${SOURCE_PATH}&per_page=1" \
            --jq '.[0].commit.committer.date // empty')
          if [[ -z "$last" ]]; then
            echo "::warning::Could not read the upstream commit history for $SOURCE_PATH"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          history_url="https://github.com/$SOURCE_OWNER_REPO/commits/main/$SOURCE_PATH"
          echo "Upstream [$SOURCE_PATH]($history_url) last changed $age_days day(s) ago ($last)." >> "$GITHUB_STEP_SUMMARY"

          if (( age_days > STALE_AFTER_DAYS )); then
            echo "::warning::Upstream has not changed for $age_days days. Check $history_url"
          fi
