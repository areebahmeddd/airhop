name: Release and Changelog

# A manual run is "Run workflow" with "Use workflow from" set to the tag. Any
# other ref is refused, so provenance always names refs/tags/<tag>.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the release signing certificate. Committed so that a change to it
  # is a reviewed diff, and checked against every signed APK and AAB below.
  # Rotating the key means changing this in the same commit, and README.md and
  # SECURITY.md with it.
  ANDROID_SIGNING_CERT_SHA256: 60d09487087c3ea4c3fbb325aebd354be629be99092020dc48b578065c18a949

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Create the GitHub release; version and changelog are already in the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every later job checks out this commit rather than the tag's name:
      # checkout prefers a branch over a tag of the same name, and working
      # branches here are named like release tags.
      - name: Resolve and validate tag
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this on a tag (Use workflow from: v1.2.3)."
            exit 1
          fi
          # The version written into app.json is the tag without its leading v,
          # so the tag has to be a plain three-part version and nothing else.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' must look like v1.2.3."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse "refs/tags/${TAG}^{commit}")"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append verification instructions
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat >> RELEASE_NOTES.md <<EOF

          <details>
          <summary><strong>Verify this download</strong></summary>

          The APK is signed with the Airhop release key (package \`org.onemindlabs.airhop\`). This workflow refuses to publish an APK signed by anything else, so the check below should print exactly one signer with this digest:

          \`\`\`
          apksigner verify --print-certs airhop.apk
          Signer #1 certificate SHA-256 digest: ${ANDROID_SIGNING_CERT_SHA256}
          \`\`\`

          It also carries SLSA build provenance. This checks it was built by this repository's release workflow from tag ${TAG}, on a GitHub-hosted runner:

          \`\`\`
          gh attestation verify airhop.apk --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml \\
            --source-ref refs/tags/${TAG} --deny-self-hosted-runners
          \`\`\`

          The same provenance is attached as \`airhop.apk.intoto.jsonl\` for offline checks.

          </details>

          <details>
          <summary><strong>Verify the source</strong></summary>

          \`airhop-${TAG}-sources.sha256\` lists the SHA-256 of every tracked file in this release.

          \`\`\`
          sha256sum -c airhop-${TAG}-sources.sha256
          git checkout ${TAG} && git status --porcelain
          \`\`\`

          The second command must print nothing. Hashes prove the listed files are unmodified; only an empty status proves no extra file was added, and the build compiles whatever is present.

          </details>
          EOF

      - name: Compose release title
        id: title
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          CODENAME=$(sed -n "s/^[[:space:]]*\"${MAJOR}\":[[:space:]]*\"\([^\"]*\)\".*/\1/p" src/data/releases.ts | head -1)
          if [ -n "${CODENAME:-}" ]; then
            echo "name=${TAG} · ${CODENAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md

  # Runs npm and Gradle, and so thousands of packages' code, which is why it
  # gets no secret and no write token. The key lives only in android-sign.
  android-build:
    name: Build Android release (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: release
    permissions:
      contents: read

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checkout is the tag
        env:
          TAG_SHA: ${{ needs.release.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Verify vendored binaries
        run: npm run verify:vendored

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      - name: Build release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          # abiFilters are merged, so build types can't narrow them.
          # gradle.properties keeps x86_64 for emulators; shipped builds include only the two ARM ABIs.
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pairhop.unsignedRelease=true

      # versionName is stamped from app.json, which only the release commit
      # sets, so a mismatch means this is not the tagged code.
      - name: Check the version and stage
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          mkdir -p unsigned
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned/airhop.apk
          mv android/app/build/outputs/bundle/release/app-release.aab unsigned/airhop.aab

          badging="$("${BUILD_TOOLS}/aapt2" dump badging unsigned/airhop.apk)"
          if ! grep -q "^package: name='org.onemindlabs.airhop' .*versionName='${VERSION}'" <<<"$badging"; then
            echo "::error::The APK is not org.onemindlabs.airhop ${VERSION}."
            grep '^package:' <<<"$badging" || true
            exit 1
          fi

      - name: Upload the unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned
          path: |
            unsigned/airhop.apk
            unsigned/airhop.aab
          if-no-files-found: error
          retention-days: 1

  # The only job that sees the signing key. It checks out nothing and runs only
  # the runner's preinstalled SDK build tools and JDK, so no project or package
  # code runs beside the key.
  android-sign:
    name: Sign and publish Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release, android-build]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned
          path: unsigned

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not set. A release is signed with the release key or not at all."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-release.keystore"

      - name: Sign APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          KEYSTORE="${RUNNER_TEMP}/airhop-release.keystore"
          mkdir -p dist

          # apksigner keeps the alignment it is given, and AGP aligns an
          # unsigned build already, 16 KiB pages for native libraries included.
          # This asserts it rather than realigning.
          "${BUILD_TOOLS}/zipalign" -c -P 16 4 unsigned/airhop.apk

          # APK Signature Scheme v2 only, as every earlier release: minSdk 26
          # needs no v1, and v3 matters only for rotating the key.
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out dist/airhop.apk \
            unsigned/airhop.apk

          # An app bundle takes a JAR signature, which is what AGP applies too.
          "${JAVA_HOME}/bin/jarsigner" \
            -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar dist/airhop.aab \
            unsigned/airhop.aab \
            "$ANDROID_KEY_ALIAS"

          rm -f "$KEYSTORE"

      - name: Check the signer
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"

          # apksigner prints several "Signer #N" lines per signer, so count the
          # distinct signers rather than the lines.
          apk="$("${BUILD_TOOLS}/apksigner" verify --print-certs dist/airhop.apk)"
          signers="$(grep -oE '^Signer #[0-9]+ ' <<<"$apk" | sort -u | wc -l)"
          if [ "$signers" -ne 1 ] || ! grep -Fxq "Signer #1 certificate SHA-256 digest: ${ANDROID_SIGNING_CERT_SHA256}" <<<"$apk"; then
            echo "::error::The APK is not signed by the release certificate alone."
            printf '%s\n' "$apk"
            exit 1
          fi

          "${JAVA_HOME}/bin/jarsigner" -verify dist/airhop.aab > /dev/null
          aab="$("${JAVA_HOME}/bin/keytool" -printcert -jarfile dist/airhop.aab)"
          digests="$(sed -n 's/^[[:space:]]*SHA256: //p' <<<"$aab" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$digests" != "$ANDROID_SIGNING_CERT_SHA256" ]; then
            echo "::error::The AAB is not signed by the release certificate alone."
            printf '%s\n' "$aab"
            exit 1
          fi

      - name: Attest APK build provenance
        id: attest-apk
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/airhop.apk

      - name: Stage APK provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-apk.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.apk.intoto.jsonl

      - name: Upload APK and provenance to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/airhop.apk
            dist/airhop.apk.intoto.jsonl
          overwrite_files: false

      # Attest the uploaded AAB before Play re-signs it.
      - name: Attest AAB build provenance
        id: attest-aab
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/airhop.aab

      - name: Stage AAB provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-aab.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.aab.intoto.jsonl

      - name: Upload AAB and provenance as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-playstore-aab
          path: |
            dist/airhop.aab
            dist/airhop.aab.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  ios-release:
    name: Release iOS to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    needs: release
    # Sign, upload to TestFlight, push the listing. Review submission is manual.
    # Signing happens in the same job as the build here (fastlane gym), so it
    # restores no cache a poisoned run could have written.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js
        with:
          cache: ""

      - name: Verify vendored binaries
        run: npm run verify:vendored

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      # Frozen: installs exactly what Gemfile.lock names, verified against its
      # CHECKSUMS, and fails rather than resolve anything new.
      - name: Install fastlane and CocoaPods
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          locked="$(awk '/^COCOAPODS: /{ print $2 }' Podfile.lock)"
          pinned="$(bundle exec pod --version)"
          if [ "$locked" != "$pinned" ]; then
            echo "::error::ios/Podfile.lock was written by CocoaPods ${locked:-unknown}, Gemfile.lock pins ${pinned}."
            exit 1
          fi
          bundle exec pod install

      # Distribution certificate and App Store profile, like the Android keystore.
      - name: Decode signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-appstore.mobileprovision"
          echo "IOS_CERTIFICATE_FILE=${RUNNER_TEMP}/airhop-distribution.p12" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_FILE=${RUNNER_TEMP}/airhop-appstore.mobileprovision" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane ios beta

      # Apple re-signs for distribution, so this attests the upload, like the AAB.
      - name: Attest IPA build provenance
        id: attest-ipa
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ios/build/Airhop.ipa

      - name: Stage IPA provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-ipa.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" ios/build/Airhop.ipa.intoto.jsonl

      - name: Upload IPA and provenance as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-testflight-ipa
          path: |
            ios/build/Airhop.ipa
            ios/build/Airhop.ipa.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

      # After the upload, so a listing error never blocks the build.
      - name: Push App Store listing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bundle exec fastlane ios metadata

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    # Publish the release software bill of materials.
    permissions:
      contents: write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: airhop.spdx.json
          upload-release-assets: false

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop.spdx.json
          overwrite_files: false

  source-manifest:
    name: Publish Source Manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    # Publishes SHA-256 hashes of tracked source files to verify source integrity.
    # Complements the SBOM by proving the source matches this release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Generate source manifest
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/source-manifest.js \
            --output "airhop-${TAG}-sources.sha256" \
            --tag "${TAG}"

      - name: Attest source manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: airhop-${{ needs.release.outputs.tag }}-sources.sha256

      - name: Upload source manifest to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop-${{ needs.release.outputs.tag }}-sources.sha256
          overwrite_files: false
