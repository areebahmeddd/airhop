name: Release and Changelog

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Create the GitHub release and update the tracked project version.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            echo "::error::This workflow must run on a tag. For a manual run, supply the 'tag' input."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository."
            exit 1
          fi
          # The version written into app.json is the tag without its leading v,
          # so the tag has to be a plain three-part version and nothing else.
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' must look like v1.2.3."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --output docs/dev/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append verification instructions
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat >> RELEASE_NOTES.md <<EOF

          ## Verify this download

          The APK is signed with the Airhop release key and carries SLSA build provenance from this repository.

          \`\`\`
          gh attestation verify airhop.apk --repo ${GITHUB_REPOSITORY}
          \`\`\`

          The same provenance is attached as \`airhop.apk.intoto.jsonl\` for offline checks.

          ## Verify the source

          \`airhop-${TAG}-sources.sha256\` lists the SHA-256 of every tracked file in this release.

          \`\`\`
          sha256sum -c airhop-${TAG}-sources.sha256
          git checkout ${TAG} && git status --porcelain
          \`\`\`

          The second command must print nothing. Hashes prove the listed files are unmodified; only an empty status proves no extra file was added, and the build compiles whatever is present.
          EOF

      - name: Compose release title
        id: title
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          CODENAME=$(sed -n "s/^[[:space:]]*\"${MAJOR}\":[[:space:]]*\"\([^\"]*\)\".*/\1/p" src/data/releases.ts | head -1)
          if [ -n "${CODENAME:-}" ]; then
            echo "name=${TAG} · ${CODENAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md

      - name: Commit version and changelog to main
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/dev/CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git fetch origin main
          # Restore the generated changelog after switching to main.
          git checkout -f -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" docs/dev/CHANGELOG.md
          # Keep app.json and iOS MARKETING_VERSION in sync with the tag so version
          # reporting stays consistent. Android reads app.json at build time; iOS reads
          # MARKETING_VERSION from the Xcode project.
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json
          sed -i -E "s/(MARKETING_VERSION = )[^;]*(;)/\1${VERSION}\2/" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = ${VERSION};" ios/Airhop.xcodeproj/project.pbxproj
          # Keep iOS CFBundleVersion monotonic for App Store Connect.
          # Matches the versioning scheme used by Android versionCode.
          IOS_BUILD=$(( ${VERSION%%.*} * 10000
            + $(echo "${VERSION}" | cut -d. -f2) * 100
            + $(echo "${VERSION}" | cut -d. -f3) ))
          sed -i -E "s/(CURRENT_PROJECT_VERSION = )[^;]*(;)/\1${IOS_BUILD}\2/" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = ${IOS_BUILD};" ios/Airhop.xcodeproj/project.pbxproj
          echo "iOS CFBundleVersion set to ${IOS_BUILD}"
          git add docs/dev/CHANGELOG.md app.json ios/Airhop.xcodeproj/project.pbxproj
          if git diff --staged --quiet; then
            echo "Version and changelog unchanged."
          else
            git commit -m "chore(release): set version and changelog for ${{ steps.resolve.outputs.tag }} [skip ci]"
            git push origin main
          fi

  android-release:
    name: Release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: release
    # Build, attest, and publish the Android release artifacts.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Stamp app version from tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/airhop-release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded; the build will be signed with the release key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Falling back to the debug key. Add the four signing secrets to ship a properly signed release."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # abiFilters are merged, so build types can't narrow them.
          # gradle.properties keeps x86_64 for emulators; shipped builds include only the two ARM ABIs.
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mv android/app/build/outputs/apk/release/app-release.apk dist/airhop.apk

      - name: Attest APK build provenance
        id: attest-apk
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/airhop.apk

      - name: Stage APK provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-apk.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.apk.intoto.jsonl

      - name: Upload APK and provenance to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/airhop.apk
            dist/airhop.apk.intoto.jsonl

      # Build the Play Store upload bundle.
      - name: Build release AAB (Google Play upload bundle)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Stage AAB
        run: |
          set -euo pipefail
          mv android/app/build/outputs/bundle/release/app-release.aab dist/airhop.aab

      # Attest the uploaded AAB before Play re-signs it.
      - name: Attest AAB build provenance
        id: attest-aab
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/airhop.aab

      - name: Stage AAB provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-aab.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.aab.intoto.jsonl

      - name: Upload AAB and provenance as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-playstore-aab
          path: |
            dist/airhop.aab
            dist/airhop.aab.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  ios-release:
    name: Release iOS to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    needs: release
    # Sign, upload to TestFlight, push the listing. Review submission is manual.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Stamp app version from tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          IOS_BUILD=$(( ${VERSION%%.*} * 10000 \
            + $(echo "${VERSION}" | cut -d. -f2) * 100 \
            + $(echo "${VERSION}" | cut -d. -f3) ))
          sed -i '' -E "s/(MARKETING_VERSION = )[^;]*(;)/\1${VERSION}\2/" ios/Airhop.xcodeproj/project.pbxproj
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION = )[^;]*(;)/\1${IOS_BUILD}\2/" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = ${VERSION};" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = ${IOS_BUILD};" ios/Airhop.xcodeproj/project.pbxproj

      - name: Set up JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          pod_version="$(awk '/^COCOAPODS: /{ print $2 }' Podfile.lock)"
          if [[ -z "$pod_version" ]]; then
            echo "::error::No COCOAPODS version recorded in ios/Podfile.lock"
            exit 1
          fi
          sudo gem install cocoapods --version "$pod_version" --no-document
          pod "_${pod_version}_" install

      # Distribution certificate and App Store profile, like the Android keystore.
      - name: Decode signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-appstore.mobileprovision"
          echo "IOS_CERTIFICATE_FILE=${RUNNER_TEMP}/airhop-distribution.p12" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE_FILE=${RUNNER_TEMP}/airhop-appstore.mobileprovision" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane ios beta

      # Apple re-signs for distribution, so this attests the upload, like the AAB.
      - name: Attest IPA build provenance
        id: attest-ipa
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ios/build/Airhop.ipa

      - name: Stage IPA provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-ipa.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" ios/build/Airhop.ipa.intoto.jsonl

      - name: Upload IPA and provenance as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-testflight-ipa
          path: |
            ios/build/Airhop.ipa
            ios/build/Airhop.ipa.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

      # After the upload, so a listing error never blocks the build.
      - name: Push App Store listing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bundle exec fastlane ios metadata

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    # Publish the release software bill of materials.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: airhop.spdx.json
          upload-release-assets: false

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop.spdx.json

  source-manifest:
    name: Publish Source Manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    # Publishes SHA-256 hashes of tracked source files to verify source integrity.
    # Complements the SBOM by proving the source matches this release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Generate source manifest
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/source-manifest.js \
            --output "airhop-${TAG}-sources.sha256" \
            --tag "${TAG}"

      - name: Attest source manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: airhop-${{ needs.release.outputs.tag }}-sources.sha256

      - name: Upload source manifest to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop-${{ needs.release.outputs.tag }}-sources.sha256
