name: Set up JavaScript toolchain
description: Install Node.js with npm caching and the project's locked dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"
  cache:
    description: >-
      Package manager whose cache setup-node restores and saves. Empty turns
      caching off, for a job that holds a secret a poisoned cache could reach.
    required: false
    default: "npm"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        # Follows `cache` explicitly, so adding a packageManager field to
        # package.json cannot turn caching back on for a job that switched it off.
        package-manager-cache: ${{ inputs.cache != '' }}

    - name: Install dependencies
      shell: bash
      run: npm ci
