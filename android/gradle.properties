# Build settings for the Android app. This file, not app.json, is what the
# build reads: prebuild is never run in this repository, so the manifest and
# these properties are hand-maintained (see AndroidManifest.xml).

# React Native builds are memory-heavy; 4 GB keeps a full native compile from
# running out mid-way.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

# R8 in release builds only, wired to app/proguard-rules.pro. A release-only
# runtime fault means a missing keep rule there.
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true

# The development ABI set, and the only control over which ABIs a build
# produces: a buildType's abiFilters merge with this rather than narrow it (see
# app/build.gradle). armeabi-v7a is still common on entry-level handsets in the
# markets this app targets; x86_64 keeps `npm run android` working on an
# emulator and the release workflows drop it with
# -PreactNativeArchitectures=arm64-v8a,armeabi-v7a. x86 has no shipping device
# or current emulator.
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

# New Architecture on: the bridge specs in src/bridge/ are reached through its
# interop layer (see .github/skills/native-boundary.md). Hermes is the engine
# on both platforms; JSC is only a fallback wired in app/build.gradle.
# Edge-to-edge draws behind the system bars, which the shell's insets expect.
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

expo.gif.enabled=true
expo.webp.enabled=true
# Off: iOS has no animated webp, so a sender could not know it plays.
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Read by expo-constants during the Gradle build so .env files resolve.
systemProp.NODE_ENV=development

# Native libraries stay uncompressed in the APK and are mapped at install time.
expo.useLegacyPackaging=false

expo.inlineModules.watchedDirectories=[]
# Android 8.0, read by the Expo root plugin into rootProject.ext. The WiFi
# Aware data path is gated at runtime (API 29+) and LAN at 26, so the floor is
# the BLE mesh and the foreground service, not the fast paths.
android.minSdkVersion=26