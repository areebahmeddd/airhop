buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  // Nothing resolves from JitPack, which builds artifacts from any GitHub
  // repository on demand, so it is not searched. A future dependency that
  // needs it gets a content filter naming its group, not the whole repository.
  repositories {
    google()
    mavenCentral()
  }

  // Pin every resolved dependency, transitive ones included, to the
  // per-project gradle.lockfile, so two builds of one commit resolve the same
  // versions. Regenerate when upgrading and review the diff; the root task
  // does not resolve subprojects, so both are needed:
  //   ./gradlew dependencies --write-locks
  //   ./gradlew :app:dependencies --write-locks
  //
  // Locked here: external Maven artifacts (AndroidX, Kotlin, the Expo modules,
  // which publish real coordinates), so bumping one of those npm packages
  // means regenerating in the same commit. Not locked here: community React
  // Native modules autolinked from node_modules, which are project
  // dependencies built from source and are fixed by package-lock.json.
  dependencyLocking {
    lockAllConfigurations()
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
