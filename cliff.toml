[changelog]
header = """
# Changelog

All notable changes are documented here. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})

### What's New

{% for commit in commits %}{% if commit.author.name is not containing("[bot]") %}\
{% set subject = commit.message | split(pat="\n") | first | trim %}\
{% if commit.remote.username %}{% set handle = commit.remote.username %}\
{% elif commit.author.email is ending_with("@users.noreply.github.com") %}{% set handle = commit.author.email | split(pat="@") | first | split(pat="+") | last %}\
{% else %}{% set handle = commit.author.name %}{% endif %}\
- {{ subject }} (by @{{ handle }})\
{% if commit.remote.pr_number and subject is not containing("(#" ~ commit.remote.pr_number ~ ")") %} (#{{ commit.remote.pr_number }}){% endif %} \
[{{ commit.id | truncate(length=7, end="") }}]
{% endif %}{% endfor %}
{% if previous.version %}**Full changelog:** [{{ previous.version }}..{{ version }}](https://github.com/areebahmeddd/airhop/compare/{{ previous.version }}..{{ version }})
{% endif %}
"""
footer = ""
trim = false

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^[a-z]+(\\(.+?\\))?!?:", skip = false },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
