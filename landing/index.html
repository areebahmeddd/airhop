      <h1>Airhop</h1>
      <p>
        Airhop is a free, open-source messenger for iOS and Android that works with no internet.
        Nearby phones form a Bluetooth Low Energy mesh and relay messages for each other, up to
        seven hops, end-to-end encrypted. There are no servers, no accounts and no tracking. When
        the internet is available, Nostr relays extend conversations beyond radio range. Airhop is
        wire-compatible with bitchat and MIT licensed.
      </p>
