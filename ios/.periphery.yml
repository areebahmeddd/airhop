# Periphery dead-code scan (https://github.com/peripheryapp/periphery).
# Run from ios/. A report to read, not a gate, until a baseline is committed.
project: Airhop.xcworkspace
schemes:
  - Airhop
targets:
  - Airhop
# Bridge entry points are reached from TypeScript through the .mm shims,
# which the indexer cannot see, so everything Objective-C-visible is a root.
retain_objc_accessible: true
retain_public: true
retain_codable_properties: true
relative_results: true
# An iOS-only app: the scan needs a device destination, and no signing.
build_arguments:
  - -destination
  - generic/platform=iOS
  - CODE_SIGNING_ALLOWED=NO
  - CODE_SIGNING_REQUIRED=NO
  - CODE_SIGN_IDENTITY=
